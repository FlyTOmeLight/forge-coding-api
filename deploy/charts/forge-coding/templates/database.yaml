apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector: {app: {{ .Release.Name }}-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector: {matchLabels: {app: {{ .Release.Name }}-postgres}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          envFrom: [{secretRef: {name: {{ required "database.existingSecret required" .Values.database.existingSecret }}}}]
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, postgres]}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 512Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.database.storage }}}}
