apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-workspace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-workspace
rules:
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims, secrets]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-workspace
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-workspace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-workspace
