{{- if .Values.gitlabCredentials.enabled }}
{{- $name := printf "%s-gitlab-credentials" .Release.Name }}
{{- $namespace := .Release.Namespace }}
{{- $targets := list (dict "namespace" $namespace "deployment" (printf "%s-api" .Release.Name) "container" "api") (dict "namespace" $namespace "deployment" (printf "%s-dispatcher" .Release.Name) "container" "dispatcher") }}
{{- $targets = concat $targets .Values.gitlabCredentials.otherTargets }}
{{- $namespaces := concat (list $namespace) .Values.gitlabCredentials.otherNamespaces }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ $name }}
spec: {}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
{{- if eq $ns $namespace }}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ $name }}]
    verbs: [get, update]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
spec:
  schedule: {{ .Values.gitlabCredentials.schedule | quote }}
  timeZone: {{ .Values.gitlabCredentials.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: {{ $name }}
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
          containers:
            - name: credentials
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: [/forge, gitlab-credentials]
              env:
                - name: GITLAB_ROTATION_CONFIG
                  value: {{ dict "source" (dict "namespace" $namespace "name" .Values.existingSecret "key" "GITLAB_TOKEN") "stateSecret" $name "url" (required "gitlabCredentials.url required" .Values.gitlabCredentials.url) "namespaces" $namespaces "targets" $targets "beforeDays" .Values.gitlabCredentials.beforeDays "lifetimeDays" .Values.gitlabCredentials.lifetimeDays "graceSeconds" .Values.gitlabCredentials.graceSeconds | toJson | quote }}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              resources:
                requests: {cpu: 50m, memory: 96Mi}
                limits: {cpu: "1", memory: 256Mi}
{{- end }}
