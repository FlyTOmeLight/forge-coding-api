name: Coding checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: coding_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/coding_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure private SDK access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYNETRC'
          import os
          from pathlib import Path
          credentials = Path.home() / ".netrc"
          credentials.write_text("machine github.com\nlogin x-access-token\npassword " + os.environ["GH_TOKEN"] + "\n")
          credentials.chmod(0o600)
          PYNETRC
          go env -w GOPRIVATE=github.com/FlyTOmeLight/forge-coding-api
      - run: make integration build
      - uses: azure/setup-helm@v4.3.0
      - run: helm lint deploy/charts/forge-coding --set existingSecret=test,database.existingSecret=test
      - run: docker build -f deploy/docker/Dockerfile --secret id=github_netrc,src="$HOME/.netrc" -t forge-coding-api:ci .
