apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: {{ .Release.Name }}-api}}
  template:
    metadata:
      annotations:
        forge/config-revision: {{ .Values.configRevision | default "initial" | quote }}
      labels: {app: {{ .Release.Name }}-api}
    spec:
      serviceAccountName: {{ .Release.Name }}-workspace
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/forge]
          args: [migrate]
          volumeMounts: [{name: gitlab-token, mountPath: /var/run/forge-gitlab, readOnly: true}]
          env:
            - {name: GITLAB_TOKEN_FILE, value: /var/run/forge-gitlab/token}
            - {name: WORKSPACE_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: SANDBOX_GATEWAY_URL, value: "http://{{ .Release.Name }}"}
            - {name: WORKSPACE_JOB_IMAGE, value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"}
          envFrom: [{secretRef: {name: {{ required "existingSecret required" .Values.existingSecret }}}}]
      volumes:
        - name: gitlab-token
          secret:
            secretName: {{ .Values.existingSecret }}
            items: [{key: GITLAB_TOKEN, path: token}]
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/forge, api]
          volumeMounts: [{name: gitlab-token, mountPath: /var/run/forge-gitlab, readOnly: true}]
          env:
            - {name: GITLAB_TOKEN_FILE, value: /var/run/forge-gitlab/token}
            - {name: WORKSPACE_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: SANDBOX_GATEWAY_URL, value: "http://{{ .Release.Name }}"}
            - {name: WORKSPACE_JOB_IMAGE, value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"}
          envFrom: [{secretRef: {name: {{ required "existingSecret required" .Values.existingSecret }}}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 512Mi}
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 2}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dispatcher
spec:
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: {{ .Release.Name }}-dispatcher}}
  template:
    metadata:
      annotations:
        forge/config-revision: {{ .Values.configRevision | default "initial" | quote }}
      labels: {app: {{ .Release.Name }}-dispatcher}
    spec:
      serviceAccountName: {{ .Release.Name }}-workspace
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      volumes:
        - name: gitlab-token
          secret:
            secretName: {{ .Values.existingSecret }}
            items: [{key: GITLAB_TOKEN, path: token}]
      containers:
        - name: dispatcher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/forge, dispatcher]
          volumeMounts: [{name: gitlab-token, mountPath: /var/run/forge-gitlab, readOnly: true}]
          env:
            - {name: GITLAB_TOKEN_FILE, value: /var/run/forge-gitlab/token}
            - {name: WORKSPACE_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: SANDBOX_GATEWAY_URL, value: "http://{{ .Release.Name }}"}
            - {name: WORKSPACE_JOB_IMAGE, value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"}
          envFrom: [{secretRef: {name: {{ required "existingSecret required" .Values.existingSecret }}}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app: {{ .Release.Name }}-api}
  ports: [{port: 80, targetPort: 8080}]
